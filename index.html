<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onur'un Programları</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff8ec,#1d1830);--ink:light-dark(#2b2440,#f6f0ff);--card:light-dark(#fff,#2b2446)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:34px;line-height:1.1;margin:0 0 6px}
p{margin:0 0 24px;opacity:.75}
a.app{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.ic{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:#ffe08a}
b{display:block;font-size:19px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Onur'un Programları</h1>
  <p>Ev ve aile için küçük uygulamalar.</p>
  <a class="app" href="zeynep-sayilar.html">
    <span class="ic">🔢</span>
    <span><b>Zeynep'in Sayıları</b>1'den 100'e kadar sayıları dinle ve söyle.</span>
  </a>
</div>
</body>
</html>
